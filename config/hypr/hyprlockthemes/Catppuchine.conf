# /* ---- 🍮 Catppuccin Macchiato 🍮 ---- */  #
# Hyprlock config in Catppuccin Macchiato style

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = /usr/share/sddm/themes/simple_sddm_2/Backgrounds/default
    
    noise = 0.01
    contrast = 1.1
    brightness = 0.9
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# Date - синий акцент
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = rgb(6e738d) # Catppuccin blue
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -150
    halign = center
    valign = center
}

# Hour-Time - основной фиолетовый акцент
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgb(6e738d) # Catppuccin mauve
    font_size = 220
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -50
    halign = center
    valign = top
}

# Minute-Time - синий контраст
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgb(6e738d) # Catppuccin blue
    font_size = 220
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -350
    halign = center
    valign = top
}

# Seconds-Time - нейтральный серый
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%S")"
    color = rgb(6e738d) # Catppuccin overlay0
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    position = 0, -370
    halign = center
    valign = top
}

# USER - розовый
label {
    monitor =
    text =   $USER
    color = rgb(ed8796) # Catppuccin red
    font_size = 26
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = bottom
}

# INPUT FIELD - Catppuccin стиль
input-field {
    monitor =
    size = 250, 65
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(c6a0f6) # Catppuccin mauve рамка
    inner_color = rgb(1e2030) # Catppuccin mantle
    capslock_color = rgb(ed8796) # Catppuccin red для CapsLock
    font_color = rgb(cad3f5) # Catppuccin text
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##6e738d">󰌾 Введите пароль...</span></i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Keyboard LAYOUT - серый
label {
    monitor =
    text = $LAYOUT
    color = rgb(6e738d) # Catppuccin overlay0
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 65
    halign = center
    valign = bottom
}

# battery information - зеленый
label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = rgb(a6da95) # Catppuccin green
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = right
    valign = bottom
}

# weather - голубой
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = rgb(7dc4e4) # Catppuccin sapphire
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 50, 0
    halign = left
    valign = bottom
}

# Дополнительный декоративный элемент
label {
    monitor =
    text = ──────────────────────
    color = rgb(363a4f) # Catppuccin surface0
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = bottom
}
