# /* ---- 💫 Gruvbox Material Dark Hard 💫 ---- */  #
# Hyprlock config in authentic Gruvbox style

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = /usr/share/sddm/themes/simple_sddm_2/Backgrounds/default
    
    noise = 0.01
    contrast = 1.1
    brightness = 0.9
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# Date - более контрастный
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = rgb(fb4934) # Gruvbox fg0 - яркий желтый
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -150
    halign = center
    valign = center
}

# Hour-Time - основной акцент (более яркий)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgb(fb4934) # Gruvbox yellow - сохраняем, но сделаем более заметным
    font_size = 220
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -50
    halign = center
    valign = top
}

# Minute-Time - более яркий контраст
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgb(83a598) # Gruvbox aqua - хороший контраст
    font_size = 220
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -350
    halign = center
    valign = top
}

# Seconds-Time - более заметный серый
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%S")"
    color = rgb(fe8019) # Gruvbox fg2 - светлее чем fg4
    font_size = 50
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, -360
    halign = center
    valign = top
}

# USER - яркий акцент
label {
    monitor =
    text =   $USER
    color = rgb(83a598) # Gruvbox fg0 - яркий желтый
    font_size = 26
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = bottom
}

# INPUT FIELD - улучшенная читаемость
input-field {
    monitor =
    size = 250, 65
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(fabd2f) # Gruvbox yellow рамка
    inner_color = rgb(282828) # Gruvbox bg0 - темнее для контраста
    capslock_color = rgb(fb4934) # Gruvbox red для CapsLock
    font_color = rgb(fbf1c7) # Gruvbox fg0 - самый яркий текст
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font Medium
    placeholder_text = <i><span foreground="##d5c4a1">󰌾 Введите пароль...</span></i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Keyboard LAYOUT - более заметный
label {
    monitor =
    text = $LAYOUT
    color = rgb(d5c4a1) # Gruvbox fg2 - светлее
    font_size = 14
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 65
    halign = center
    valign = bottom
}

# battery information - яркий зеленый
label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = rgb(8ec07c) # Gruvbox aqua
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 30
    halign = right
    valign = bottom
}

# weather - более яркий синий
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = rgb(83a598) # Gruvbox blue
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 50, 0
    halign = left
    valign = bottom
}

# Дополнительный декоративный элемент - более контрастный
label {
    monitor =
    text = ──────────────────────
    color = rgb(504945) # Gruvbox bg2 - темнее разделитель
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = bottom
}

# Дополнительный элемент - текущий год
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%Y')"
    color = rgb(8ec07c) # Gruvbox fg3
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -190
    halign = center
    valign = center
}
