# /* ---- 🌙 Tokyo Night Moon 🌙 ---- */  #
# Hyprlock config in Tokyo Night Moon style

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = /usr/share/sddm/themes/simple_sddm_2/Backgrounds/default
    
    noise = 0.01
    contrast = 1.1
    brightness = 0.9
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# Date - синий акцент
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = rgb(9d7cd8) # Tokyo Night blue
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -150
    halign = center
    valign = center
}

# Hour-Time - основной фиолетовый акцент
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgb(7aa2f7) # Tokyo Night purple
    font_size = 220
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -50
    halign = center
    valign = top
}

# Minute-Time - синий контраст
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgb(9d7cd8) # Tokyo Night blue
    font_size = 220
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -350
    halign = center
    valign = top
}

# Seconds-Time - нейтральный серый
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%S")"
    color = rgb(565f89) # Tokyo Night comment grey
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    position = 0, -370
    halign = center
    valign = top
}

# USER - фиолетовый
label {
    monitor =
    text =   $USER
    color = rgb(9d7cd8) # Tokyo Night purple
    font_size = 26
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = bottom
}

# INPUT FIELD - Tokyo Night стиль
input-field {
    monitor =
    size = 250, 65
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(9d7cd8) # Tokyo Night purple рамка
    inner_color = rgb(1a1b26) # Tokyo Night moon bg
    capslock_color = rgb(f7768e) # Tokyo Night red для CapsLock
    font_color = rgb(c0caf5) # Tokyo Night fg
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##565f89">󰌾 Введите пароль...</span></i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Keyboard LAYOUT - серый
label {
    monitor =
    text = $LAYOUT
    color = rgb(565f89) # Tokyo Night comment grey
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 65
    halign = center
    valign = bottom
}

# battery information - зеленый
label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = rgb(73daca) # Tokyo Night teal
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = right
    valign = bottom
}

# weather - голубой
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = rgb(7aa2f7) # Tokyo Night blue
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 50, 0
    halign = left
    valign = bottom
}

# Дополнительный декоративный элемент
label {
    monitor =
    text = ──────────────────────
    color = rgb(414868) # Tokyo Night dark blue
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = bottom
}
