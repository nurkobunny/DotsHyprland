# /* ---- 🧛 Dracula Hyprlock Style 🧛 ---- */  #
# Hyprlock config in authentic Dracula palette

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = /usr/share/sddm/themes/simple_sddm_2/Backgrounds/default

    noise = 0.01
    contrast = 1.1
    brightness = 0.9
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = rgb(255,121,198) # Dracula pink
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -150
    halign = center
    valign = center
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgb(189,147,249) # Dracula purple
    font_size = 220
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -50
    halign = center
    valign = top
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgb(80,250,123) # Dracula green
    font_size = 220
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -350
    halign = center
    valign = top
}

# Seconds-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%S")"
    color = rgb(255,184,108) # Dracula orange
    font_size = 50
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, -360
    halign = center
    valign = top
}

# USER
label {
    monitor =
    text =   $USER
    color = rgb(139,233,253) # Dracula cyan
    font_size = 26
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 65
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(189,147,249) # Dracula purple
    inner_color = rgb(40,42,54)    # Dracula background
    capslock_color = rgb(255,85,85) # Dracula red
    font_color = rgb(248,248,242)  # Dracula foreground
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font Medium
    placeholder_text = <i><span foreground="##6272a4">󰌾 Введите пароль...</span></i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Keyboard LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = rgb(98,114,164) # Dracula comment
    font_size = 14
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 65
    halign = center
    valign = bottom
}

# battery information
label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = rgb(80,250,123) # Dracula green
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 30
    halign = right
    valign = bottom
}

# weather
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = rgb(139,233,253) # Dracula cyan
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 50, 0
    halign = left
    valign = bottom
}

# Decorative line
label {
    monitor =
    text = ──────────────────────
    color = rgb(68,71,90) # Dracula selection
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = bottom
}

# Year
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%Y')"
    color = rgb(255,184,108) # Dracula orange
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -190
    halign = center
    valign = center
}
