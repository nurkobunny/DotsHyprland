# /* ---- ❄️ Catppuccin Latte ❄️ ---- */ #
# Hyprlock config in authentic Catppuccin Latte style

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = /usr/share/sddm/themes/simple_sddm_2/Backgrounds/default
    
    noise = 0.01
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = rgb(d20f39) # Red
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -150
    halign = center
    valign = center
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgb(1e66f5) # Blue
    font_size = 220
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -50
    halign = center
    valign = top
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgb(ea76cb) # Pink
    font_size = 220
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -350
    halign = center
    valign = top
}

# Seconds-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%S")"
    color = rgb(7c7f93) # Steel Gray (Subtext 1)
    font_size = 50
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, -360
    halign = center
    valign = top
}

# USER
label {
    monitor =
    text =   $USER
    color = rgb(1e66f5) # Blue
    font_size = 26
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 65
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(1e66f5) # Blue
    inner_color = rgb(eff1f5) # Base (Light BG)
    capslock_color = rgb(d20f39) # Red
    font_color = rgb(4c4f69) # Text (Dark FG)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font Medium
    placeholder_text = <i><span foreground="##7c7f93">󰌾 Введите пароль...</span></i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Keyboard LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = rgb(8c8fa1) # Overlay 1
    font_size = 14
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 65
    halign = center
    valign = bottom
}

# battery information
label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = rgb(40a02b) # Green
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 30
    halign = right
    valign = bottom
}

# weather
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = rgb(1e66f5) # Blue
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 50, 0
    halign = left
    valign = bottom
}

# Decorative line
label {
    monitor =
    text = ──────────────────────
    color = rgb(ccd0da) # Surface 1
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = bottom
}

# Current year
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%Y')"
    color = rgb(8c8fa1) # Overlay 1
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -190
    halign = center
    valign = center
}
