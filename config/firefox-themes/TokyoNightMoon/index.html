<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #222536;
      color: #c0caf5;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    input[type="text"] {
      background: #292e42;
      color: #c0caf5;
      border: none;
      padding: 16px 24px;
      font-size: 24px;
      width: 400px;
      border-radius: 6px;
    }
    input[type="submit"] {
      background: #414868;
      color: #c0caf5;
      border: none;
      padding: 16px 24px;
      margin-left: 12px;
      font-size: 24px;
      cursor: pointer;
      border-radius: 6px;
    }
    form {
      display: flex;
      margin-bottom: 60px;
    }
  </style>
</head>
<body>
</body>
</html>
