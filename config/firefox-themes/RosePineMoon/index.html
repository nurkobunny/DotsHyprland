<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #282639;
      color: #e0def4;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    input[type="text"] {
      background: #2a273f;
      color: #e0def4;
      border: 1px solid #393552;
      padding: 16px 24px;
      font-size: 24px;
      width: 400px;
      border-radius: 6px;
    }
    input[type="submit"] {
      background: #c4a7e7;
      color: #282639;
      border: none;
      padding: 16px 24px;
      margin-left: 12px;
      font-size: 24px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }
    input[type="submit"]:hover {
      background: #ea9a97;
    }
    form {
      display: flex;
      margin-bottom: 60px;
    }
  </style>
</head>
<body>
</body>
</html>
