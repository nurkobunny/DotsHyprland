<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #eff1f5;
      color: #4c4f69;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    input[type="text"] {
      background: #e6e9ef;
      color: #4c4f69;
      border: 1px solid #ccd0da;
      padding: 16px 24px;
      font-size: 24px;
      width: 400px;
      border-radius: 6px;
    }
    input[type="text"]::placeholder {
      color: #7c7f93;
    }
    input[type="submit"] {
      background: #8839ef;
      color: #eff1f5;
      border: none;
      padding: 16px 24px;
      margin-left: 12px;
      font-size: 24px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }
    input[type="submit"]:hover {
      background: #ea76cb;
    }
    form {
      display: flex;
      margin-bottom: 60px;
    }
  </style>
</head>
<body>
</body>
</html>
