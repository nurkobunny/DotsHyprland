<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
  body {
    margin: 0;
    background: #23232B;
    color: #DCD7BA;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  input[type="text"] {
    background: #2A2A37;
    color: #DCD7BA;
    border: 1px solid #363646;
    padding: 16px 24px;
    font-size: 24px;
    width: 400px;
    border-radius: 6px;
    outline: none;
  }
  input[type="submit"] {
    background: #7E9CD8;
    color: #23232B;
    border: none;
    padding: 16px 24px;
    margin-left: 12px;
    font-size: 24px;
    cursor: pointer;
    border-radius: 6px;
    font-weight: bold;
  }
  input[type="submit"]:hover {
    background: #A3D4D5;
  }
</style>
</head>
<body>
</body>
</html>
